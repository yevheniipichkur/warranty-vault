name: Build iOS IPA

on:
  workflow_dispatch:
    inputs:
      export_method:
        description: "Export method for signed IPA"
        required: true
        default: "ad-hoc"
        type: choice
        options:
          - ad-hoc
          - app-store
          - development
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: macos-26
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      SCHEME: WarrantyVault
      PROJECT: WarrantyVault.xcodeproj
      SIMULATOR_DESTINATION: platform=iOS Simulator,name=iPad (A16),OS=26.4.1
      EXPORT_METHOD: ${{ github.event_name == 'push' && 'app-store' || github.event.inputs.export_method || 'ad-hoc' }}
      CI_BUILD_NUMBER: ${{ github.run_number }}.${{ github.run_attempt }}
      BUNDLE_ID_SECRET: ${{ secrets.BUNDLE_ID || 'com.yevheniipichkur.warrantyvault' }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID || 'G66CMCY8H2' }}
      CERTIFICATE_BASE64: ${{ secrets.CERTIFICATE_BASE64 }}
      CERTIFICATE_PASSWORD: ${{ secrets.CERTIFICATE_PASSWORD }}
      PROVISIONING_PROFILE_BASE64: ${{ secrets.PROVISIONING_PROFILE_BASE64 }}
      LIVE_ACTIVITY_PROVISIONING_PROFILE_BASE64: ${{ secrets.LIVE_ACTIVITY_PROVISIONING_PROFILE_BASE64 }}
      APP_STORE_PROVISIONING_PROFILE_BASE64: ${{ secrets.APP_STORE_PROVISIONING_PROFILE_BASE64 }}
      APP_STORE_LIVE_ACTIVITY_PROVISIONING_PROFILE_BASE64: ${{ secrets.APP_STORE_LIVE_ACTIVITY_PROVISIONING_PROFILE_BASE64 }}
      KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
      ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
      ASC_API_ISSUER_ID: ${{ secrets.ASC_API_ISSUER_ID }}
      ASC_API_KEY_BASE64: ${{ secrets.ASC_API_KEY_BASE64 }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode
        run: |
          xcodebuild -version
          xcrun --version
          xcodebuild -showsdks | grep iphoneos || true

      - name: Install XcodeGen
        run: |
          brew update
          brew install xcodegen

      - name: Generate Xcode project
        run: |
          chmod +x Scripts/generate_project.sh Scripts/build_ipa.sh
          ./Scripts/generate_project.sh

      - name: Prepare build folders
        run: mkdir -p build/logs build/ipa build/simulator

      - name: Verify AppIcon PNGs have no alpha channel
        run: |
          python3 - <<'PYEOF'
          import struct, sys
          from pathlib import Path

          appiconset = Path("WarrantyVault/Resources/Assets.xcassets/AppIcon.appiconset")
          pngs = sorted(appiconset.glob("*.png"))
          if not pngs:
              print("::error::No PNG files found in AppIcon.appiconset")
              sys.exit(1)

          failed = False
          for p in pngs:
              data = p.read_bytes()
              # PNG IHDR: bytes 24=bit_depth, 25=color_type
              # color_type 2=RGB, 6=RGBA, 4=Gray+A
              color_type = data[25]
              has_alpha = color_type in (4, 6)
              w = struct.unpack(">I", data[16:20])[0]
              h = struct.unpack(">I", data[20:24])[0]
              status = "RGBA - HAS ALPHA" if has_alpha else "RGB  - OK"
              print(f"  {'::error::' if has_alpha else ''}  {p.name}: {w}x{h} color_type={color_type} ({status})")
              if has_alpha:
                  failed = True

          if failed:
              print("::error::One or more AppIcon PNG files have alpha channel. App Store will reject the IPA.")
              sys.exit(1)
          print("All AppIcon PNGs are RGB (no alpha channel)")
          PYEOF

      - name: Run tests
        run: |
          set -o pipefail
          BUNDLE_ID_VALUE="${BUNDLE_ID_SECRET:-com.yevheniipichkur.warrantyvault}"
          echo "Using CI build number: $CI_BUILD_NUMBER"
          xcodebuild \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -destination "$SIMULATOR_DESTINATION" \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=YES \
            CODE_SIGNING_REQUIRED=NO \
            APP_BUNDLE_ID="$BUNDLE_ID_VALUE" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            CURRENT_PROJECT_VERSION="$CI_BUILD_NUMBER" \
            clean test 2>&1 | tee build/logs/test.log

      - name: Simulator build when signing secrets are missing
        if: ${{ env.CERTIFICATE_BASE64 == '' || env.PROVISIONING_PROFILE_BASE64 == '' || env.APPLE_TEAM_ID == '' || env.BUNDLE_ID_SECRET == '' }}
        run: |
          set -o pipefail
          echo "Signing secrets are missing. Building simulator app only; no signed IPA will be produced."
          BUNDLE_ID_VALUE="${BUNDLE_ID_SECRET:-com.yevheniipichkur.warrantyvault}"
          xcodebuild \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -destination "$SIMULATOR_DESTINATION" \
            -configuration Debug \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            APP_BUNDLE_ID="$BUNDLE_ID_VALUE" \
            CURRENT_PROJECT_VERSION="$CI_BUILD_NUMBER" \
            build | tee build/logs/simulator-build.log
          APP_PATH="$(find build/DerivedData/Build/Products -type d -name 'WarrantyVault.app' -path '*iphonesimulator*' -print -quit)"
          if [[ -n "$APP_PATH" ]]; then
            ditto -c -k --keepParent "$APP_PATH" build/simulator/WarrantyVault-simulator-app.zip
          fi

      - name: Install signing certificate and provisioning profile
        if: ${{ env.CERTIFICATE_BASE64 != '' && env.PROVISIONING_PROFILE_BASE64 != '' && env.APPLE_TEAM_ID != '' && env.BUNDLE_ID_SECRET != '' }}
        run: |
          CERTIFICATE_PATH="$RUNNER_TEMP/signing_certificate.p12"
          PROFILE_PATH="$RUNNER_TEMP/profile.mobileprovision"
          PROFILE_PLIST="$RUNNER_TEMP/profile.plist"
          LIVE_ACTIVITY_PROFILE_PATH="$RUNNER_TEMP/liveactivity.mobileprovision"
          LIVE_ACTIVITY_PROFILE_PLIST="$RUNNER_TEMP/liveactivity.plist"
          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"

          echo -n "$CERTIFICATE_BASE64" | base64 -D > "$CERTIFICATE_PATH"

          # Select provisioning profile based on export method
          if [[ "$EXPORT_METHOD" == "app-store" && -n "${APP_STORE_PROVISIONING_PROFILE_BASE64:-}" ]]; then
            echo "Using App Store provisioning profiles"
            echo -n "$APP_STORE_PROVISIONING_PROFILE_BASE64" | base64 -D > "$PROFILE_PATH"
            LA_PROFILE_DATA="${APP_STORE_LIVE_ACTIVITY_PROVISIONING_PROFILE_BASE64:-}"
          else
            echo "Using Ad Hoc provisioning profiles"
            echo -n "$PROVISIONING_PROFILE_BASE64" | base64 -D > "$PROFILE_PATH"
            LA_PROFILE_DATA="${LIVE_ACTIVITY_PROVISIONING_PROFILE_BASE64:-}"
          fi

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" -P "$CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          security cms -D -i "$PROFILE_PATH" > "$PROFILE_PLIST"
          PROFILE_UUID=$(/usr/libexec/PlistBuddy -c "Print UUID" "$PROFILE_PLIST")
          PROFILE_NAME=$(/usr/libexec/PlistBuddy -c "Print Name" "$PROFILE_PLIST")
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$PROFILE_PATH" "$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_UUID.mobileprovision"

          echo "PROVISIONING_PROFILE_NAME=$PROFILE_NAME" >> "$GITHUB_ENV"
          echo "PROVISIONING_PROFILE_UUID=$PROFILE_UUID" >> "$GITHUB_ENV"

          if [[ -n "${LA_PROFILE_DATA:-}" ]]; then
            echo -n "$LA_PROFILE_DATA" | base64 -D > "$LIVE_ACTIVITY_PROFILE_PATH"
            security cms -D -i "$LIVE_ACTIVITY_PROFILE_PATH" > "$LIVE_ACTIVITY_PROFILE_PLIST"
            LIVE_ACTIVITY_PROFILE_UUID=$(/usr/libexec/PlistBuddy -c "Print UUID" "$LIVE_ACTIVITY_PROFILE_PLIST")
            LIVE_ACTIVITY_PROFILE_NAME=$(/usr/libexec/PlistBuddy -c "Print Name" "$LIVE_ACTIVITY_PROFILE_PLIST")
            cp "$LIVE_ACTIVITY_PROFILE_PATH" "$HOME/Library/MobileDevice/Provisioning Profiles/$LIVE_ACTIVITY_PROFILE_UUID.mobileprovision"
            echo "LIVE_ACTIVITY_PROVISIONING_PROFILE_NAME=$LIVE_ACTIVITY_PROFILE_NAME" >> "$GITHUB_ENV"
          else
            echo "LIVE_ACTIVITY_PROVISIONING_PROFILE_NAME=$PROFILE_NAME" >> "$GITHUB_ENV"
          fi

      - name: Create ExportOptions.plist
        if: ${{ env.CERTIFICATE_BASE64 != '' && env.PROVISIONING_PROFILE_BASE64 != '' && env.APPLE_TEAM_ID != '' && env.BUNDLE_ID_SECRET != '' }}
        run: |
          XCODE_EXPORT_METHOD="$EXPORT_METHOD"
          if [[ "$XCODE_EXPORT_METHOD" == "ad-hoc" ]]; then
            XCODE_EXPORT_METHOD="release-testing"
          elif [[ "$XCODE_EXPORT_METHOD" == "development" ]]; then
            XCODE_EXPORT_METHOD="debugging"
          elif [[ "$XCODE_EXPORT_METHOD" == "app-store" ]]; then
            XCODE_EXPORT_METHOD="app-store-connect"
          fi
          echo "Using xcodebuild export method: $XCODE_EXPORT_METHOD"

          cat > ExportOptions.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "https://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>${XCODE_EXPORT_METHOD}</string>
            <key>teamID</key>
            <string>${APPLE_TEAM_ID}</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>${BUNDLE_ID_SECRET}</key>
              <string>${PROVISIONING_PROFILE_NAME}</string>
              <key>${BUNDLE_ID_SECRET}.liveactivity</key>
              <string>${LIVE_ACTIVITY_PROVISIONING_PROFILE_NAME}</string>
            </dict>
            <key>compileBitcode</key>
            <false/>
          </dict>
          </plist>
          EOF

      - name: Archive and export signed IPA
        if: ${{ env.CERTIFICATE_BASE64 != '' && env.PROVISIONING_PROFILE_BASE64 != '' && env.APPLE_TEAM_ID != '' && env.BUNDLE_ID_SECRET != '' }}
        run: |
          set -o pipefail
          xcodebuild \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath build/archive/WarrantyVault.xcarchive \
            APP_BUNDLE_ID="$BUNDLE_ID_SECRET" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            APP_PROVISIONING_PROFILE_SPECIFIER="$PROVISIONING_PROFILE_NAME" \
            LIVE_ACTIVITY_PROVISIONING_PROFILE_SPECIFIER="$LIVE_ACTIVITY_PROVISIONING_PROFILE_NAME" \
            ASSETCATALOG_COMPILER_APPICON_NAME=AppIcon \
            CURRENT_PROJECT_VERSION="$CI_BUILD_NUMBER" \
            clean archive 2>&1 | tee build/logs/archive.log

          echo "=== ExportOptions.plist ==="
          cat ExportOptions.plist

          xcodebuild \
            -exportArchive \
            -archivePath build/archive/WarrantyVault.xcarchive \
            -exportPath build/ipa \
            -exportOptionsPlist ExportOptions.plist 2>&1 | tee build/logs/export.log

          echo "Export output:"
          find build/ipa -maxdepth 3 -type f -print || true

          IPA_PATH="$(find build/ipa -name '*.ipa' -print -quit)"
          if [[ -z "$IPA_PATH" ]]; then
            echo "::error::xcodebuild exportArchive finished, but no .ipa was produced."
            echo "ExportOptions.plist:"
            cat ExportOptions.plist
            echo "build/ipa contents:"
            find build/ipa -maxdepth 3 -print || true
            exit 1
          fi

          echo "IPA_PATH=$IPA_PATH" >> "$GITHUB_ENV"

      - name: Validate IPA bundle before upload
        if: ${{ env.IPA_PATH != '' }}
        run: |
          mkdir -p build/ipa_inspect
          unzip -q "$IPA_PATH" -d build/ipa_inspect
          APP="build/ipa_inspect/Payload/WarrantyVault.app"

          echo "=== Info.plist relevant keys ==="
          plutil -p "$APP/Info.plist" | grep -E "CFBundleIconName|CFBundleIcons|CFBundleDisplayName|CFBundleIdentifier|CFBundleVersion" || echo "(none matched)"

          echo "=== Bundle root contents ==="
          ls -la "$APP/"

          echo "=== Assets.car AppIcon check ==="
          if [[ -f "$APP/Assets.car" ]]; then
            xcrun assetutil --info "$APP/Assets.car" 2>/dev/null | grep -i "AppIcon\|icon" || echo "No AppIcon entries found in Assets.car"
          else
            echo "::error::Assets.car not found in app bundle!"
          fi

          echo "=== Live Activity Info.plist ==="
          plutil -p "$APP/PlugIns/WarrantyVaultLiveActivity.appex/Info.plist" 2>/dev/null | grep -E "CFBundleDisplayName|NSExtensionPointIdentifier" || echo "(none matched)"

          # Gate: fail CI before upload if CFBundleIconName is missing
          if ! plutil -p "$APP/Info.plist" | grep -q '"CFBundleIconName"'; then
            echo "::error::CFBundleIconName is missing from compiled Info.plist. Full plist:"
            plutil -p "$APP/Info.plist"
            exit 1
          fi
          echo "✓ CFBundleIconName present in IPA"

          # Gate: fail if Assets.car missing
          if [[ ! -f "$APP/Assets.car" ]]; then
            echo "::error::Assets.car missing from app bundle — icons not compiled"
            exit 1
          fi
          echo "✓ Assets.car present in IPA"

      - name: Upload to TestFlight
        if: ${{ env.EXPORT_METHOD == 'app-store' && env.IPA_PATH != '' && env.ASC_API_KEY_ID != '' && env.ASC_API_ISSUER_ID != '' && env.ASC_API_KEY_BASE64 != '' }}
        run: |
          mkdir -p ~/.private_keys
          echo -n "$ASC_API_KEY_BASE64" | base64 -D > ~/.private_keys/AuthKey_${ASC_API_KEY_ID}.p8

          xcrun altool \
            --upload-app \
            --type ios \
            --file "$IPA_PATH" \
            --apiKey "$ASC_API_KEY_ID" \
            --apiIssuer "$ASC_API_ISSUER_ID" \
            --verbose 2>&1 | tee build/logs/upload.log

      - name: Print diagnostics on failure
        if: failure()
        run: |
          emit_annotation() {
            local title="$1"
            local log="$2"
            if [[ -f "$log" ]]; then
              local message
              message="$(tail -n 80 "$log")"
              message="${message//'%'/'%25'}"
              message="${message//$'\r'/'%0D'}"
              message="${message//$'\n'/'%0A'}"
              echo "::error file=$log,title=$title::$message"
            fi
          }

          emit_matches() {
            local title="$1"
            local log="$2"
            if [[ -f "$log" ]]; then
              local message
              message="$(grep -n -i -E "error:|fatal error|testing failed|test failed|failed:|cannot |no such module|provisioning|code sign|requires a provisioning profile|no profiles|doesn't include" "$log" | tail -n 120 || true)"
              if [[ -n "$message" ]]; then
                message="${message//'%'/'%25'}"
                message="${message//$'\r'/'%0D'}"
                message="${message//$'\n'/'%0A'}"
                echo "::error file=$log,title=$title::$message"
              fi
            fi
          }

          echo "## WarrantyVault build diagnostics" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"

          for log in build/logs/test.log build/logs/archive.log build/logs/export.log build/logs/upload.log; do
            if [[ -f "$log" ]]; then
              echo "### $log" >> "$GITHUB_STEP_SUMMARY"
              echo '```text' >> "$GITHUB_STEP_SUMMARY"
              tail -n 160 "$log" >> "$GITHUB_STEP_SUMMARY"
              echo '```' >> "$GITHUB_STEP_SUMMARY"
              echo "" >> "$GITHUB_STEP_SUMMARY"
            fi
          done

          emit_matches "WarrantyVault test.log errors" "build/logs/test.log"
          emit_matches "WarrantyVault archive.log errors" "build/logs/archive.log"
          emit_matches "WarrantyVault export.log errors" "build/logs/export.log"
          emit_matches "WarrantyVault upload.log errors" "build/logs/upload.log"
          emit_annotation "WarrantyVault test.log tail" "build/logs/test.log"
          emit_annotation "WarrantyVault archive.log tail" "build/logs/archive.log"
          emit_annotation "WarrantyVault export.log tail" "build/logs/export.log"
          emit_annotation "WarrantyVault upload.log tail" "build/logs/upload.log"

          echo "### Files" >> "$GITHUB_STEP_SUMMARY"
          echo '```text' >> "$GITHUB_STEP_SUMMARY"
          find build -maxdepth 4 -print >> "$GITHUB_STEP_SUMMARY" || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"

          echo "Diagnostics were written to the GitHub Actions summary."

      - name: Upload signed IPA artifact
        if: ${{ env.IPA_PATH != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: WarrantyVault-signed-ipa
          path: build/ipa/*.ipa
          if-no-files-found: error

      - name: Upload simulator artifact
        if: ${{ env.CERTIFICATE_BASE64 == '' || env.PROVISIONING_PROFILE_BASE64 == '' || env.APPLE_TEAM_ID == '' || env.BUNDLE_ID_SECRET == '' }}
        uses: actions/upload-artifact@v4
        with:
          name: WarrantyVault-simulator-build
          path: build/simulator/*
          if-no-files-found: warn

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: WarrantyVault-build-logs
          path: build/logs/*
          if-no-files-found: warn
