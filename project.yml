name: WarrantyVault
options:
  bundleIdPrefix: com.yourname
  deploymentTarget:
    iOS: "17.0"
  minimumXcodeGenVersion: "2.42.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    APP_BUNDLE_ID: com.yevheniipichkur.warrantyvault
    DEVELOPMENT_TEAM: G66CMCY8H2
    CURRENT_PROJECT_VERSION: "1"
    MARKETING_VERSION: "1.0.0"
    CODE_SIGN_STYLE: Automatic
    GENERATE_INFOPLIST_FILE: NO
targets:
  WarrantyVault:
    type: application
    platform: iOS
    sources:
      - path: WarrantyVault
        excludes:
          - App/Info.plist
    dependencies:
      - target: WarrantyVaultLiveActivity
        embed: true
      - sdk: PhotosUI.framework
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Warranty Vault
        INFOPLIST_KEY_CFBundleIconName: AppIcon
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: "Select receipt, product, and warranty document images to store locally in Warranty Vault."
        INFOPLIST_KEY_NSSupportsLiveActivities: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        PRODUCT_NAME: WarrantyVault
        PRODUCT_BUNDLE_IDENTIFIER: "$(APP_BUNDLE_ID)"
        PROVISIONING_PROFILE_SPECIFIER: "$(APP_PROVISIONING_PROFILE_SPECIFIER)"
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: false
        ENABLE_USER_SCRIPT_SANDBOXING: false
  WarrantyVaultLiveActivity:
    type: app-extension
    platform: iOS
    sources:
      - path: WarrantyVaultLiveActivity
        excludes:
          - Info.plist
      - path: WarrantyVault/LiveActivity/WarrantyActivityAttributes.swift
    resources:
      - path: WarrantyVault/Localization
    info:
      path: WarrantyVaultLiveActivity/Info.plist
      properties:
        CFBundleDisplayName: Warranty Activity
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        GENERATE_INFOPLIST_FILE: NO
        PRODUCT_NAME: WarrantyVaultLiveActivity
        PRODUCT_BUNDLE_IDENTIFIER: "$(APP_BUNDLE_ID).liveactivity"
        PROVISIONING_PROFILE_SPECIFIER: "$(LIVE_ACTIVITY_PROVISIONING_PROFILE_SPECIFIER)"
        APPLICATION_EXTENSION_API_ONLY: true
        SKIP_INSTALL: true
  WarrantyVaultTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests/WarrantyVaultTests
      - path: WarrantyVault/Models
      - path: WarrantyVault/Utilities
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.yevheniipichkur.warrantyvault.tests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  WarrantyVault:
    build:
      targets:
        WarrantyVault: [run, archive, profile, analyze]
        WarrantyVaultTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - WarrantyVaultTests
    archive:
      config: Release
